name: DSH plugin checks and release
on:
  push:
    tags: ['dsh-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dsh-plugin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          run_install: false
      - run: npm ci --ignore-scripts --omit=peer --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
        working-directory: dsh-plugin
      - run: python scripts/build-dsh.py
      - run: node --test dsh-plugin/test/*.test.mjs
      - run: node scripts/package-dsh.mjs
      - name: Install exact DSH runtime for clean-profile verification
        run: npm install --prefix .dsh-ci @deepseek-ai/dsh@0.2.0-rc.2 --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
      - run: node scripts/ci-install.mjs
      - run: python scripts/package-delivery.py
      - name: Verify tag matches package
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const p=require('./dsh-plugin/package.json');if(process.env.GITHUB_REF_NAME!=='dsh-v'+p.version)process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-installable
          path: release/*
